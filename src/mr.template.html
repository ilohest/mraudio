<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Ortica Linear';
        src: url('assets/fonts/OrticaLinear-Light.woff2') format('woff2');
        font-weight: 300;
      }
      * { margin: 0; }
      /* Vignette du lecteur système : un carré plein, lisible réduit à 64 px sur un écran
         verrouillé. D'où les deux lettres seules, très grandes, sans rien autour. */
      body {
        width: 512px;
        height: 512px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff5bb;
        color: #222222;
        font-family: 'Ortica Linear', Georgia, serif;
        font-weight: 300;
        -webkit-font-smoothing: antialiased;
      }
      p {
        font-size: 268px;
        line-height: 1;
        letter-spacing: -0.02em;
        /* La fonte porte ses propres approches : on recale optiquement le bloc. */
        transform: translate(6px, -10px);
      }
    </style>
  </head>
  <body>
    <p>MR</p>
  </body>
</html>
